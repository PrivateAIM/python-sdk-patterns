[tool.poetry]
name = "flame"
version = "1.0.0"
description = ""
authors = ["Alexander Röhl <alexander.roehl@uni-tuebingen.de>", "David Hieber <david.hieber@uni-tuebingen.de>"]
readme = "README.md"
license = "Apache-2.0"
packages = [{ include = "flame" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
flamesdk = {git = "https://github.com/PrivateAIM/python-sdk.git", branch = "canary"}
opendp = "^0.15.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0"
ruff = ">=0.9.0"
pre-commit = ">=4.0.0"
scikit-learn = ">=1.6.0"
matplotlib = ">=3.7.2"
pandas = ">=2.0.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
# The wrapping the codebase already used; ruff cannot infer the Python floor
# from poetry's dependency table, so target-version is set explicitly.
line-length = 120
target-version = "py310"
